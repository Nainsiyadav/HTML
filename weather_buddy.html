<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid red;
            
        }
        .wrapper{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid blue;
            width: 80%;
            height: 100%;
            gap: 20px;
        }
        .heading{
            font: 800;
            font-size: 60px;
            color: teal;
            font-style: italic;
        }
        .card{
            background-color: teal;
            padding: 20px;
        }
        .card input{
            padding: 5px;
        }
        .card button{
            padding: 5px;
            color: white;
            background-color: rgb(14, 14, 15);
        }
        .output{
            color: rgb(22, 23, 23);
             font-weight: 500;
             font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <h1 class="heading">WEATHER BUDDY</h1>
            <div class="card">
                <input id="weather" type="text"  placeholder="Enter weather">
                <button class="button">What to carry</button>
            </div>
            <span class="output"></span>
        </div>
    </div>
</body>
<script>
  let weather = document.getElementById("weather")
  let button = document.querySelector(".button")
  let output = document.querySelector(".output")

  button.addEventListener("click",()=>{
    if(weather.value ==="sunny"){
        output.textContent = "take your sunglasses"
       
    }else if(weather.value === "rainy"){
        output.textContent = "take your unbrella"
      
    }else {
        alert("invalid!");
    }
  });
</script>
</html>
